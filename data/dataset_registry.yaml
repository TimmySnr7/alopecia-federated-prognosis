      primary: norwood_scale_proxy
      secondary: null
    approximate_n: 5000
    skin_tone_coverage: unknown_pending_audit
    key_limitation: "Proxy labels and broad web variability may reduce label cleanliness."
  fitzpatrick17k:
    title: "Fitzpatrick17k"
    source_type: public
    url: "https://github.com/mattgroh/fitzpatrick17k"
    licence: "Check upstream repository and publication terms before use"
    role_in_exp01: audit_only
    subtype_focus: dermatology_broad
    label_schema:
      primary: fitzpatrick_skin_type
      secondary: diagnosis
    approximate_n: 17000
    skin_tone_coverage: broad_by_design
    key_limitation: "Not scalp- or alopecia-specific, so unsuitable as a primary prognosis training set."
  ddi:
    title: "Diverse Dermatology Images"
    source_type: public
    url: "https://ddi-dataset.github.io/index.html"
    licence: "Check upstream dataset access and use terms before use"
    role_in_exp01: audit_only
    subtype_focus: dermatology_broad
    label_schema:
      primary: skin_condition
      secondary: skin_tone_annotation
    approximate_n: unknown_pending_audit
    skin_tone_coverage: diversity_focused
    key_limitation: "Useful for fairness auditing but not a direct alopecia prognosis training source."
  skincare:
    title: "SkinCaRe multimodal dermatology dataset"
    source_type: huggingface
    url: "https://huggingface.co/datasets/yuhos16/SkinCaRe"
    licence: "Check upstream dataset card before use"
    role_in_exp01: metadata_reference
    subtype_focus: hair_and_skin_conditions
    label_schema:
      primary: caption_and_condition_metadata
      secondary: dermatologist_caption
    approximate_n: unknown_pending_audit
    skin_tone_coverage: unknown_pending_audit
    key_limitation: "Multimodal richness is useful later, but labels are too heterogeneous for the first narrow baseline."
