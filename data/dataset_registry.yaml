  unidpro_hair_loss_male_norwood_scale:
    title: "Hair loss male Norwood scale"
    source_type: kaggle
    url: "https://www.kaggle.com/datasets/unidpro/hair-loss-male-norwood-scale"
    licence: "Check Kaggle terms and dataset-specific terms before use"
    role_in_exp01: training
