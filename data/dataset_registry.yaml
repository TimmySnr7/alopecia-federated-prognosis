  unidatapro_women_hair_loss:
    title: "UniDataPro women hair-loss dataset"
    source_type: huggingface
    url: "https://huggingface.co/datasets/UniDataPro/women-hair-loss-dataset"
    licence: "Check upstream dataset card before use"
    role_in_exp01: training
    subtype_focus: female_pattern_hair_loss_proxy
