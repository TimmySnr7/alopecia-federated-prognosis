      secondary: null
    approximate_n: 2400
    skin_tone_coverage: unknown_pending_audit
    key_limitation: "Likely biased toward web-scraped top-view examples with uneven acquisition conditions."
  tapakah68_bald_people:
    title: "Dataset of bald people"
    source_type: kaggle
    url: "https://www.kaggle.com/datasets/tapakah68/dataset-of-bald-people"
    licence: "Check Kaggle terms and dataset-specific terms before use"
    role_in_exp01: training
    subtype_focus: aga_proxy
