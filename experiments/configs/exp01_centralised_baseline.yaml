name: exp01_centralised_baseline
description: >
  Centralised proxy-prognosis baseline for androgenetic alopecia using
  severity-conditioned latent diffusion on a curated public-data pool.
seed: 42
mode: centralised
objective:
  type: proxy_prognostic_generation
  claim_boundary: >
    This experiment generates severity-conditioned future-like scalp scenarios
    rather than asserting true longitudinal prediction.
  primary_question: >
    Can a centralised latent diffusion model generate clinically plausible
    higher-severity scalp images from pooled public alopecia data before
    federation and privacy constraints are introduced?
dataset:
  split: public_pooled
  registry: data/dataset_registry.yaml
  included:
    - unidatapro_men_hair_loss
    - unidatapro_women_hair_loss
    - unidpro_hair_loss_male_norwood_scale
    - tapakah68_bald_people
  resolution: 256
  curation_rules:
    subtype_focus: aga_priority
    allowed_labels:
      - norwood_stage
      - ludwig_stage
    excluded_for_training:
      - fitzpatrick17k
      - ddi
      - skincare
    role_of_excluded_sets:
      - fairness_audit_only
      - transfer_or_metadata_reference
  split_strategy:
    train: 0.7
    validation: 0.15
    test: 0.15
  audit_gate:
    required: true
    checks:
      - licence_review
      - label_schema_review
      - viewpoint_consistency
      - duplicate_screening
      - skin_tone_coverage_note
conditioning_schema:
  input_image: baseline_scalp_image
  current_severity: ordinal_stage
  target_severity: ordinal_stage
  derived_delta: target_minus_current
  optional_covariates:
    - sex
  rationale: >
    The baseline keeps conditioning narrow so that target-stage sensitivity can
    be evaluated before broader multimodal covariates are introduced.
model:
  architecture: latent_diffusion
  initial_checkpoint: stabilityai/stable-diffusion-2-1-base
  conditioning: cross_attention
  severity_head:
    enabled: true
    target: severity_class_proxy
    classes:
      - stage_1
      - stage_2
      - stage_3
      - stage_4
      - stage_5
      - stage_6
      - stage_7
  uncertainty:
    method: stochastic_sampling
    samples_per_case: 8
  training_rationale: >
    The baseline assumes fine-tuning from a strong latent diffusion checkpoint
    rather than random initialisation. Ten epochs are a feasibility-first
    default and will be adjusted if validation quality continues to improve.
training:
  epochs: 10
  batch_size: 4
  optimizer: adamw
  learning_rate: 1.0e-4
  gradient_accumulation_steps: 4
  mixed_precision: fp16
  early_stopping:
    enabled: true
    monitor: validation_lpips
    patience: 3
  checkpoint_policy:
    save_best_by: validation_lpips
    save_last: true
evaluation:
  metrics: [lpips, domain_fid, ssim, ece, brier_score, interval_coverage]
  calibration_target: severity_class_proxy
  calibration_method: temperature_scaling_on_severity_head
  domain_fid:
    feature_extractor: resnet18_scalp_encoder
    initialisation: imagenet_pretrained_then_finetuned_on_held_out_scalp_images
    comparison_pool: held_out_test_split
    fallback_if_unavailable: inception_v3_fid_with_limitation_note
  success_criteria:
    - stable_training_without_divergence
    - target_severity_changes_shift_generated_outputs_directionally
    - lpips_and_domain_fid_improve_over_untrained_or_random_baseline
    - "calibration_metrics_on_severity_head_are_reportable_and_interpretable"
governance:
  raw_partner_data_in_git: false
  public_outputs_allowed:
    - configs
    - code
    - aggregate_metrics
    - synthetic_examples_only_if_dataset_licences_allow
compute_environment:
  hardware: single_gpu_feasibility_default
  preferred_gpu: nvidia_a100_40gb_or_equivalent
  minimum_gpu: consumer_gpu_with_gradient_accumulation
  estimated_runtime_hours: 12
  scaling_note: >
    Resolution 256x256, batch size 4, and the single-GPU setup are
    feasibility-checked defaults for the first run. They may be scaled if later
    compute access and project time permit.
hypotheses:
  primary: >
    A latent diffusion model conditioned on current severity and target
    severity will generate scalp images whose derived severity predictions
    increase monotonically as the target severity increases.
  secondary:
    - >
      Conditioning on target severity will outperform an unconditioned baseline
      on severity-consistency checks and LPIPS.
    - >
      Temperature scaling on the auxiliary severity head will reduce ECE on the
      held-out test split without materially worsening Brier score.
failure_conditions:
  - training_diverges_or_collapses
  - generated_outputs_ignore_target_severity
  - calibration_metrics_cannot_be_defined_cleanly_on_the_auxiliary_target
